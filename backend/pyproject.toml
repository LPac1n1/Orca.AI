[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-ai"
version = "0.1.0"
description = "Montador de orçamentos para projetos sociais de OSCs"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "ortools>=9.10",
    "playwright>=1.45",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "pypdf>=4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
orca = "orca.api.principal:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[tool.setuptools.packages.find]
include = ["orca*"]

[tool.setuptools.package-data]
orca = [
    "regras/*.yaml",
    "banco/migracoes/*.py",
    "banco/migracoes/*.mako",
    "banco/migracoes/versions/*.py",
    "documentos/modelos/*.html",
    "api/estatico/*",
    "api/estatico/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = [
    "navegador: abre o Microsoft Edge do Windows (pulado se não estiver instalado)",
    "rede: acessa a internet (só roda com ORCA_TESTES_REDE=1)",
]
