# Uso em desenvolvimento (gerar migrações). O programa não usa este arquivo.
#   cd backend && python -m alembic revision --autogenerate -m "descrição"
[alembic]
script_location = orca/banco/migracoes
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///../dados/desenvolvimento.sqlite
