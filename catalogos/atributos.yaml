# Atributos críticos por categoria e vocabulário (docs/05-regras-padrao.md §3).
# Além destes, marca, modelo e apresentação são sempre obrigatórios (D-17).
# O catálogo pode ser ampliado pelo usuário e compartilhado.
#
# Atributos com medida (peso, volume, gramatura, folhas, unidades, medidas,
# concentração, voltagem…) são lidos pelo programa (orca/correspondencia/medidas.py).
# Atributos de texto (tipo, sabor, fragrância, cor, embalagem) usam o vocabulário
# abaixo: dentro de um grupo os valores se excluem — se o item diz um e a página
# diz outro, o produto é diferente (🔴); se só um dos dois diz, fica 🟡.
# Cada valor lista os seus sinônimos (sem acento e em minúsculas, ou não: o
# programa normaliza). Características independentes (orgânico, zero lactose…)
# ficam cada uma no seu grupo.

