# Tabela de jornadas por cargo (docs/05-regras-padrao.md §2).
# Divisor mensal = jornada semanal máxima × 5 (D-42).
# Toda linha nova ou alterada precisa de nova revisão humana (revisado_por, revisado_em).
# Cargos fora da tabela usam "regra_geral" e geram alerta de revisão.

versao: 1
fator_divisor: 5

jornadas:
