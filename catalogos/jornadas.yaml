               designer, pedagogo(a), nutricionista, psicólogo(a), enfermeiro(a)]
    jornada_semanal_horas: 44
    divisor_mensal: 220
    fonte_legal: Constituição Federal, art. 7º, XIII; CLT, art. 58
    observacao: Psicólogo(a) e enfermeiro(a) sem lei federal que fixe jornada menor (há projetos de lei em tramitação).
