# Catálogo de lojas — rascunho inicial (Fase 0)
# Levantamento em 23/09/2026 (docs/07-levantamento-lojas.md).
# Camadas de coleta (docs/04 §5.1):
#   C0 = dados estruturados/API | C1 = página da loja (acesso simples ou navegador)
#   C2 = descoberta por buscador | C3 = agente de IA | C4 = captura assistida
#   proposta = cotação por e-mail com o fornecedor
# "busca" diz como o sistema pesquisa a loja (Fase 2, etapa 10; D-68):
#   modo api_vtex = API pública de catálogo; api_vtex_is = busca pública das lojas VTEX novas;
#   api_woocommerce = API pública de produtos (WordPress); modo pagina = página de busca do site
#   ("produto" = pedaço do endereço de uma página de produto; "seletor" = a lista de resultados);
#   modo assistida = a janela abre na busca e a pessoa escolhe o produto (D-67) — também quando
#   o robots.txt da loja proíbe a busca por programas. Sem "busca": colar o link.
#   Levantamentos: 24/09/2026 e 25/09/2026 (robots.txt, busca e uma página de produto por loja; docs/07 §5).
# "precos_na_pagina" lista os preços encontrados; "preco_a_usar" segue as
# decisões D-60 a D-63 (docs/01): preço no Pix (sem Pix, boleto; nunca parcelado), sem clube/assinatura,
# promoção aberta a todos vale, sempre o preço unitário.

versao: 1
verificado_em: 2026-09-23

lojas:
  - id: atacadao
    nome: Atacadão
    dominio: www.atacadao.com.br
    categorias: [alimentos, bebidas, limpeza, descartaveis, papelaria]
    plataforma: vtex
    coleta: C0
    endpoints:
      busca_texto: /io/api/catalog_system/pub/products/search?ft={termo}     # /api/... redireciona para /io/api/... (24/09/2026)
      busca_ean: /io/api/catalog_system/pub/products/search?fq=alternateIds_Ean:{ean}
      regiao_por_cep: /api/checkout/pub/regions?country=BRA&postalCode={cep}
    busca:
      modo: api_vtex
      url: https://www.atacadao.com.br/io/api/catalog_system/pub/products/search   # sem CEP a API traz preço 0
    ean: api
    cnpj_site: null            # vendedor "ATACADAO SA" na API; CNPJ a obter pelos dados abertos
    cep: regiao_por_cep
    acesso_simples: ok
    precos_na_pagina: [preco_unitario]
    observacoes: Melhor caso. Evidência (PDF) capturada pelo navegador na página do produto.

  - id: carrefour_mercado
    nome: Carrefour Mercado
    dominio: mercado.carrefour.com.br
    categorias: [alimentos, bebidas, limpeza, descartaveis]
    plataforma: vtex
    coleta: C1
    modo: navegador            # API recusa acesso simples (503)
    busca:                     # D-67: a busca recusa o navegador sem janela (403, 23/09/2026); com janela visível funciona
      modo: assistida
      url: https://mercado.carrefour.com.br/s?q={termo}
    ean: jsonld
    cnpj_site: [45.543.915/0736-50, 45.543.915/0846-95]
    cep: pede_cep
    acesso_simples: bloqueado_na_api
    precos_na_pagina: [preco_de, preco_por]     # "de R$ 29,89 por R$ 25,29"
    preco_a_usar: preco_por                      # D-62

  - id: extra_mercado
