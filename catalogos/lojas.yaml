      url: https://www.extramercado.com.br/busca?terms={termo}
    ean: dados_da_pagina       # __NEXT_DATA__
    cnpj_site: [47.508.411/0001-56]
    cep: a_verificar
    acesso_simples: parcial    # busca e produtos carregam por JavaScript
    precos_na_pagina: [preco_normal, preco_clube_extra]
